name: Workspace CI

on:
  push:
    paths:
      - 'workspace/**'
      - '.github/workflows/workspace-ci.yml'
  pull_request:
    paths:
      - 'workspace/**'
      - '.github/workflows/workspace-ci.yml'

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - zelo-ci
    timeout-minutes: 12
    defaults:
      run:
        working-directory: workspace
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install workspace dependencies
        run: npm install --ignore-scripts
      - name: Emit generated workspace lockfile
        run: |
          printf 'ZELO_LOCKFILE_B64='
          base64 -w0 package-lock.json
          printf '\n'
      - name: Audit workspace dependencies
        run: npm run audit
      - name: Test workspace hardening contracts
        run: npm test
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Build workspace
        run: npm run build
