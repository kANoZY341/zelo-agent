name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - zelo-ci
    # Keep the full pytest/Ruff/diff gates. Run process timing assertions after
    # the parallel suite so worker contention in CI does not hide real failures.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify self-hosted CI prerequisites
        run: |
          python3 --version
          node --version
          git --version
          bwrap --version
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "0"
      - name: Create trusted validation environment
        run: |
          rm -rf .venv
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
      - run: git diff --check origin/main...HEAD
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - name: Run parallel test suite (eight workers)
        run: .venv/bin/python -m pytest -q -n 8 --dist=loadgroup --ignore=tests/test_worker_concurrency.py --durations=30
      - name: Run worker concurrency tests (serial)
        run: .venv/bin/python -m pytest -q tests/test_worker_concurrency.py --durations=30
