[tool.ruff]
target-version = "py312"
line-length = 100
# Retained upstream sources keep their exact bytes and source-manifest identities.
extend-exclude = ["docs/reviews/*.md", "third_party/rea", "integrations/development/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["developer_boundary: real Linux Git/process/Bubblewrap tests; no model service"]
